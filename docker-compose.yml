version: '3.8'

services:
  api:
    build: .
    container_name: fuel4exam-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - APP_NAME=Fuel4Exam
      - APP_VERSION=1.0.0
      - DEBUG=False
      - ENVIRONMENT=production
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8000
      - LOG_LEVEL=INFO
      - SEED_CANDIDATE_PASSWORD=${SEED_CANDIDATE_PASSWORD}
    volumes:
      - ./logs:/app/logs
      - ./app:/app/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - fuel4exam-network

networks:
  fuel4exam-network:
    driver: bridge

# To run:
# docker-compose up -d
#
# To stop:
# docker-compose down
#
# To view logs:
# docker-compose logs -f api
#
# To rebuild:
# docker-compose up -d --build
